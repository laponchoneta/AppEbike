name: CI Buildozer APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev \
            libltdl-dev \
            ccache

      - name: Install legacy Android NDK r21e
        run: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          echo "LEGACY_NDK=$HOME/android-ndk-r21e" >> $GITHUB_ENV
          echo "LEGACY_NDK=$HOME/android-ndk-r21e"
          ls -la $HOME/android-ndk-r21e

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.36 buildozer

      - name: Check Build environment
        run: |
          which python
          python --version
          python -m pip install cython==0.29.36 buildozer
          python -m pip show buildozer
          python -m buildozer --version

      - name: Build APK
        run: |
          which python
          python --version
          python -m pip show buildozer
          python -m buildozer --version
          python -m buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk