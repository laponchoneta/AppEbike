name: CI Buildozer APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev \
            libltdl-dev \
            ccache

      - name: Install legacy Android NDK r21e with GFortran
        run: |
              cd "$HOME"

              # 1. Download official Android NDK r21e
              wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
              unzip -q android-ndk-r21e-linux-x86_64.zip

              # 2. Download fixed android-gfortran r21e toolchains
              wget -q https://github.com/mzakharo/android-gfortran/releases/download/r21e/gcc-arm-linux-x86_64.tar.bz2
              wget -q https://github.com/mzakharo/android-gfortran/releases/download/r21e/gcc-arm64-linux-x86_64.tar.bz2

              # 3. Extract both toolchains
              tar -xjf gcc-arm-linux-x86_64.tar.bz2
              tar -xjf gcc-arm64-linux-x86_64.tar.bz2

              # 4. Replace the ARM32 prebuilt toolchain inside NDK r21e
              rm -rf "$HOME/android-ndk-r21e/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64"
              mkdir -p "$HOME/android-ndk-r21e/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64"
              cp -a "$HOME/arm-linux-androideabi-4.9/." \
                "$HOME/android-ndk-r21e/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/"

              # 5. Replace the ARM64 prebuilt toolchain inside NDK r21e
              rm -rf "$HOME/android-ndk-r21e/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64"
              mkdir -p "$HOME/android-ndk-r21e/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64"
              cp -a "$HOME/aarch64-linux-android-4.9/." \
                "$HOME/android-ndk-r21e/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/"

              # 6. Expose legacy NDK to python-for-android
              echo "LEGACY_NDK=$HOME/android-ndk-r21e" >> "$GITHUB_ENV"

              # 7. Verify the exact compilers required by p4a
              echo "Checking GFortran toolchains..."
              ls -l "$HOME/android-ndk-r21e/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin/arm-linux-androideabi-gfortran"
              ls -l "$HOME/android-ndk-r21e/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin/aarch64-linux-android-gfortran"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.36 buildozer

      - name: Check Build environment
        run: |
          which python
          python --version
          python -m pip install cython==0.29.36 buildozer
          python -m pip show buildozer
          python -m buildozer --version

      - name: Build APK
        run: |
          which python
          python --version
          python -m pip show buildozer
          python -m buildozer --version
          python -m buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk